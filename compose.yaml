services:
  nvr-report:
    build:
      context: .
    image: nvr-track:local

    env_file:
      - .env

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./config/nvrs.local.json:/app/config/nvrs.local.json:ro
      - ./reports:/app/reports
      - ./state/notes:/app/state/notes:ro
      - ./state/events:/app/state/events:ro
      - ./state/snapshots:/app/state/snapshots

    stdin_open: true
    tty: true
  nvr-report-all:
    build:
      context: .
    image: nvr-track:local
    entrypoint: ["python", "-m", "scripts.run_all_nvr_reports"]

    env_file:
      - .env

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./config/nvrs.local.json:/app/config/nvrs.local.json:ro
      - ./reports:/app/reports
      - ./state/notes:/app/state/notes:ro
      - ./state/events:/app/state/events:ro
      - ./state/snapshots:/app/state/snapshots
  nvr-dashboard:
    build:
      context: .
    image: nvr-track:local
    entrypoint: ["python", "-m", "app.dashboard"]

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"
      REPORTS_DIR: /app/reports
      DASHBOARD_REFRESH_SECONDS: "${DASHBOARD_REFRESH_SECONDS:-60}"
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:?Set DASHBOARD_USERNAME in .env}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}"
      SCAN_STATE_DIR: /app/state/scan
      NVR_REQUIRED_RETENTION_DAYS: "${NVR_REQUIRED_RETENTION_DAYS:-0}"
      NOTES_DIR: /app/state/notes
      EVENTS_DIR: /app/state/events
      SNAPSHOT_DIR: /app/state/snapshots

    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:8080:8080"

    volumes:
      - ./reports:/app/reports:ro
      # Scan requests only; this container never gets NVR credentials.
      - ./state/scan:/app/state/scan
      # Known issues and repair notes (written here and by the Telegram bot).
      - ./state/notes:/app/state/notes
      - ./state/events:/app/state/events:ro
      - ./state/snapshots:/app/state/snapshots:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "dashboard"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Scheduled scans (NVR_SCAN_TIMES) and the dashboard's "Scan" requests.
  # Runs the same read-only reporters as nvr-report / nvr-report-all.
  nvr-scanner:
    build:
      context: .
    image: nvr-track:local
    entrypoint: ["python", "-m", "scripts.scan_worker"]

    env_file:
      - .env

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"
      SCAN_STATE_DIR: /app/state/scan

    volumes:
      - ./config/nvrs.local.json:/app/config/nvrs.local.json:ro
      - ./reports:/app/reports
      - ./state/scan:/app/state/scan
      - ./state/notes:/app/state/notes:ro
      - ./state/events:/app/state/events:ro
      - ./state/snapshots:/app/state/snapshots

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "heartbeat", "/app/state/scan/status.json", "120"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Telegram bot: status commands, alerts and scan requests from any phone.
  # Connects out to api.telegram.org only (no port, no firewall change).
  # Gets only TELEGRAM_* and display settings, never NVR or SMTP credentials,
  # and reads saved reports like the dashboard; scans go through nvr-scanner.
  nvr-telegram:
    build:
      context: .
    image: nvr-track:local
    entrypoint: ["python", "-m", "scripts.telegram_bot"]

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"
      REPORTS_DIR: /app/reports
      SCAN_STATE_DIR: /app/state/scan
      TELEGRAM_STATE_DIR: /app/state/telegram
      NOTES_DIR: /app/state/notes
      EVENTS_DIR: /app/state/events
      SNAPSHOT_DIR: /app/state/snapshots
      TELEGRAM_NOTES_BY: "${TELEGRAM_NOTES_BY:-admins}"
      TELEGRAM_SNAPSHOTS: "${TELEGRAM_SNAPSHOTS:-admins}"
      TELEGRAM_PICTURE_ALERTS: "${TELEGRAM_PICTURE_ALERTS:-off}"
      TELEGRAM_EVENT_DAILY_LIMIT: "${TELEGRAM_EVENT_DAILY_LIMIT:-1}"
      TELEGRAM_STREAM_DOWN_MINUTES: "${TELEGRAM_STREAM_DOWN_MINUTES:-10}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ACCESS: "${TELEGRAM_ACCESS:-allowlist}"
      TELEGRAM_BLOCKED_USER_IDS: "${TELEGRAM_BLOCKED_USER_IDS:-}"
      TELEGRAM_ADMIN_USER_IDS: "${TELEGRAM_ADMIN_USER_IDS:-}"
      TELEGRAM_ALLOWED_USER_IDS: "${TELEGRAM_ALLOWED_USER_IDS:-}"
      TELEGRAM_ALLOWED_CHAT_IDS: "${TELEGRAM_ALLOWED_CHAT_IDS:-}"
      TELEGRAM_ALERT_CHAT_IDS: "${TELEGRAM_ALERT_CHAT_IDS:-}"
      TELEGRAM_DIGEST_TIME: "${TELEGRAM_DIGEST_TIME:-08:30}"
      TELEGRAM_KNOWN_REMINDER: "${TELEGRAM_KNOWN_REMINDER:-mon 09:00}"
      NVR_KNOWN_REMINDER_DAYS: "${NVR_KNOWN_REMINDER_DAYS:-7}"
      TELEGRAM_ALERT_CHECK_SECONDS: "${TELEGRAM_ALERT_CHECK_SECONDS:-60}"
      TELEGRAM_SHOW_IPS: "${TELEGRAM_SHOW_IPS:-false}"
      NVR_CLOCK_DRIFT_WARN_SECONDS: "${NVR_CLOCK_DRIFT_WARN_SECONDS:-120}"
      NVR_REQUIRED_RETENTION_DAYS: "${NVR_REQUIRED_RETENTION_DAYS:-0}"
      # Only if the server reaches the internet through a proxy:
      HTTPS_PROXY: "${TELEGRAM_HTTPS_PROXY:-}"

    volumes:
      - ./reports:/app/reports:ro
      - ./state/scan:/app/state/scan
      - ./state/telegram:/app/state/telegram
      - ./state/notes:/app/state/notes
      - ./state/events:/app/state/events:ro
      - ./state/snapshots:/app/state/snapshots:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "heartbeat", "/app/state/telegram/heartbeat", "600"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Real-time NVR events (video loss, tampering, disk/network faults, illegal
  # logins). One read-only alertStream GET per NVR in NVR_EVENT_NVR_IDS;
  # writes state/events only. Idle when NVR_EVENT_NVR_IDS is empty.
  nvr-events:
    build:
      context: .
    image: nvr-track:local
    entrypoint: ["python", "-m", "scripts.event_listener"]

    env_file:
      - .env

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"
      EVENTS_DIR: /app/state/events

    volumes:
      - ./config/nvrs.local.json:/app/config/nvrs.local.json:ro
      - ./state/events:/app/state/events

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "heartbeat", "/app/state/events/status.json", "180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
