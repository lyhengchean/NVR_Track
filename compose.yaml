services:
  nvr-report:
    build:
      context: .
    image: nvr-track:local

    env_file:
      - .env

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./config/nvrs.local.json:/app/config/nvrs.local.json:ro
      - ./reports:/app/reports

    stdin_open: true
    tty: true
  nvr-report-all:
    build:
      context: .
    image: nvr-track:local
    entrypoint: ["python", "-m", "scripts.run_all_nvr_reports"]

    env_file:
      - .env

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./config/nvrs.local.json:/app/config/nvrs.local.json:ro
      - ./reports:/app/reports
  nvr-dashboard:
    build:
      context: .
    image: nvr-track:local
    entrypoint: ["python", "-m", "app.dashboard"]

    environment:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"
      REPORTS_DIR: /app/reports
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:?Set DASHBOARD_USERNAME in .env}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}"

    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:8080:8080"

    volumes:
      - ./reports:/app/reports:ro

    restart: unless-stopped